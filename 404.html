<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Arkan Tsabit</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
</head>
<body>
    <main class="error-page">
        <div class="container error-container">
            <div class="error-content">
                <div class="error-code">404</div>
                <h1 data-i18n="error.title">Page Not Found</h1>
                <p data-i18n="error.description">The page you are looking for does not exist or has been moved.</p>
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i>
                    <span data-i18n="error.cta">Return Home</span>
                </a>
            </div>
        </div>
    </main>
    <script src="js/i18n.js"></script>
</body>
</html>
