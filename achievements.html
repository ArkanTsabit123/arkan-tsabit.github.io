<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-on-load {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .animate-on-load-delay-1 { animation-delay: 0.1s; }
        .animate-on-load-delay-2 { animation-delay: 0.2s; }
        .animate-on-load-delay-3 { animation-delay: 0.3s; }

        .achievement-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
        }
        .achievement-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.25);
        }

        .achievement-icon {
            font-size: var(--font-size-3xl);
            color: var(--accent-blue);
            margin-bottom: var(--spacing-md);
            transition: transform 0.4s ease, color 0.3s ease;
        }
        .achievement-card:hover .achievement-icon {
            transform: scale(1.3) rotate(-5deg);
            color: var(--accent-blue-hover);
        }

        .achievement-card h3 {
            font-size: var(--font-size-lg);
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }

        .achievement-card .achievement-year {
            font-size: var(--font-size-sm);
            color: var(--accent-blue);
            font-weight: 600;
            display: block;
            margin-bottom: var(--spacing-sm);
        }

        .achievement-card p {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .section-header h2 {
            position: relative;
            display: inline-block;
        }
        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            border-radius: var(--radius-full);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--spacing-xl);
        }

        [data-theme="dark"] .achievement-card {
            background: var(--bg-secondary);
            border-color: var(--border-color);
        }
        [data-theme="dark"] .achievement-card:hover {
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.3);
        }

        @media (max-width: 768px) {
            .achievements-grid {
                grid-template-columns: 1fr;
            }
            .achievement-card:hover {
                transform: translateY(-6px);
            }
        }
    </style>
</head>
<body>

                <a href="index.html" aria-label="Home">
                    <img src="assets/images/logo.ico" alt="Arkan Tsabit Logo" class="logo-img" />
                </a>
            </div>
            <nav class="nav" role="navigation" aria-label="Main navigation">
                <ul class="nav-list" id="navList">
                    <li><a href="index.html" class="nav-link" data-i18n="nav.home">Home</a></li>
                    <li><a href="about.html" class="nav-link" data-i18n="nav.about">About Me</a></li>
                    <li><a href="projects.html" class="nav-link" data-i18n="nav.projects">Projects</a></li>
                    <li><a href="certifications.html" class="nav-link" data-i18n="nav.certifications">Certifications</a></li>
                    <li><a href="achievements.html" class="nav-link active" data-i18n="nav.achievements">Achievements</a></li>
                    <li><a href="contact.html" class="nav-link" data-i18n="nav.contact">Contact</a></li>
                </ul>
            </nav>
            <div class="header-controls">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
                    <span class="lang-text" id="langText">EN</span>
                </button>
                <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main>

        <section class="page-header animate-on-load">
            <div class="container">
                <h1 data-i18n="achievements.page_title">Achievements</h1>
                <p data-i18n="achievements.page_subtitle">Recognition and awards from my professional journey</p>

                <a href="docs.html" class="footer-doc-link">
                    <i class="fas fa-book"></i> Documentation

            <div class="footer-social">

                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=arkantsabit025@gmail.com" target="_blank" aria-label="Email">

    <script src="js/main.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/hide-docs.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var grid = document.getElementById('achievementsGrid');

            var achievements = [
                {
                    "title": "Oracle Race to Certification",
                    "year": "2025",
                    "icon": "fas fa-globe-americas",
                    "description": "Top 108 Global Leaderboard in Oracle Race to Certification 2025, competing against thousands of participants worldwide."
                },
                {
                    "title": "Oracle Race to Certification",
                    "year": "2025",
                    "icon": "fas fa-medal",
                    "description": "Top 3 Indonesia in Oracle Race to Certification 2025, demonstrating exceptional performance in Oracle Cloud certification."
                },
                {
                    "title": "Best Teacher Award",
                    "year": "2025",
                    "icon": "fas fa-chalkboard-teacher",
                    "description": "Recognized as Best Teacher at Satu Benih Boarding School in 2025 for excellence in teaching and curriculum delivery."
                }
            ];

            grid.innerHTML = '';

            for (var i = 0; i < achievements.length; i++) {
                var item = achievements[i];
                var delayClass = 'animate-on-load-delay-' + ((i % 3) + 1);
                grid.innerHTML += `
                    <div class="achievement-card animate-on-load ${delayClass}">
                        <div class="achievement-icon">
                            <i class="${item.icon}"></i>
                        </div>
                        <h3>${item.title}</h3>
                        <span class="achievement-year">${item.year}</span>
                        <p>${item.description}</p>
                    </div>
                `;
            }
        });
    </script>

</body>
</html>
