            <nav class="nav" role="navigation" aria-label="Main navigation">

                    <li><a href="index.html" class="nav-link" data-i18n="nav.home">Home</a></li>
                    <li><a href="about.html" class="nav-link" data-i18n="nav.about">About Me</a></li>
                    <li><a href="projects.html" class="nav-link" data-i18n="nav.projects">Projects</a></li>

                </ul>
            </nav>
            <div class="header-controls">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="lang-toggle" id="langToggle" aria-label="Toggle language">

                <button class="hamburger" id="hamburger" aria-label="Toggle navigation">

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main>

        <!-- ============================================================
        PAGE HEADER
        ============================================================ -->
        <section class="page-header">
            <div class="container">
                <h1 data-i18n="achievements.page_title">Achievements</h1>
                <p data-i18n="achievements.page_subtitle">Recognition and awards from my professional journey</p>
            </div>
        </section>

        <!-- ============================================================
        ACHIEVEMENTS GRID
        ============================================================ -->
        <section class="achievements-section">
            <div class="container">
                <div class="achievements-grid" id="achievementsGrid">
                    <!-- Loading State -->
                    <div class="loading-spinner" style="grid-column: 1 / -1;">
                        <i class="fas fa-spinner"></i>
                        <span>Loading achievements...</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- ============================================================

        <div class="container footer-container">
            <p class="footer-text">

                <span data-i18n="footer.credit">Data Engineer | Cloud Data Engineer</span>
            </p>
            <div class="footer-social">
                <a href="https://github.com/ArkanTsabit123" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/arkan-tsabit" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">

                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=arkantsabit025@gmail.com" target="_blank" aria-label="Email">

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="js/main.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/i18n.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('achievementsGrid');

            // Load achievements data
            fetch('data/achievements.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data.achievements || data.achievements.length === 0) {
                        throw new Error('No achievements data found');
                    }
                    renderAchievements(data.achievements);
                })
                .catch(error => {
                    console.error('Error loading achievements:', error);
                    grid.innerHTML = `
                        <div class="error-message" style="grid-column: 1 / -1;">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Unable to load achievements. Please try again later.</p>
                            <button class="btn btn-secondary btn-sm" onclick="location.reload()" style="margin-top: var(--spacing-md);">
                                <i class="fas fa-redo"></i> Retry
                            </button>
                        </div>
                    `;
                });

            function renderAchievements(achievements) {
                grid.innerHTML = achievements.map(item => `
                    <div class="achievement-card">
                        <div class="achievement-icon">
                            <i class="${item.icon || 'fas fa-trophy'}"></i>
                        </div>
                        <h3>${item.title}</h3>
                        <span class="achievement-year">${item.year || ''}</span>
                        <p>${item.description}</p>
                        ${item.link ? `
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm" style="margin-top: var(--spacing-md);">
                                <i class="fas fa-external-link-alt"></i> Learn More
                            </a>
                        ` : ''}
                    </div>
                `).join('');
            }
        });
    </script>

</body>
</html>
